name: 測試

on:
  push:
  pull_request:

jobs:
  server:
    # 排程演算法的 26 項回歸測試。
    # 跑兩種時區：Render 上是 UTC，開發機（和 Codex）多半是 Asia/Taipei。
    # 以前踩過「本機時區解析 + UTC 輸出差一天」的坑，這裡就是在守這件事。
    name: 後端測試（TZ=${{ matrix.tz }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一個時區壞掉，另一個也要跑完才知道是不是時區問題
      matrix:
        tz: [UTC, Asia/Taipei]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  build:
    # Render 是 build 完才部署，所以這裡先確認前端建得起來，
    # 免得語法錯誤要等到部署才發現。
    name: 前端建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
