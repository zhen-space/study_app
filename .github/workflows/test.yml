name: 測試

# push 只跑 default branch，其餘分支交給 pull_request。
#
# 原本兩個 trigger 都不加條件，於是同 repo 的 PR 分支每 push 一次就同時滿足
# push 與 pull_request，一個 commit 產生兩套一模一樣的 run、8 個 job。除了白白
# 燒掉一半額度，實際上還讓其中一個 job 卡在 in_progress 直到 6 小時上限被系統
# cancel（連續發生過五次）。
#
# 代價：沒有開 PR 的分支不會自動跑 CI。這裡的工作一律走 PR，所以可以接受。
on:
  push:
    branches: [claude/student-study-planner-13xdjo]
  pull_request:

# 同一個 ref 連續 push 時，舊的那次已經沒有人要看了，讓它讓位。
#
# group 同時包含 ref 與 event_name，所以只會取消「同一個 PR／同一個分支、
# 同一種事件」的前一次執行，不可能誤殺別的 PR 或別的分支。
# default branch 例外：它的每個 commit 都是已合併的歷史，CI 紀錄要留著。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/student-study-planner-13xdjo' }}

jobs:
  server:
    # 排程演算法的 26 項回歸測試。
    # 跑三種時區：Render 上是 UTC，開發機多半是 Asia/Taipei，
    # America/New_York 可抓出另一側 UTC offset 的日期邊界問題。
    # 以前踩過「本機時區解析 + UTC 輸出差一天」的坑，這裡就是在守這件事。
    name: 後端測試（TZ=${{ matrix.tz }}）
    runs-on: ubuntu-latest
    # recurring hang 要留下診斷證據，但不能再佔用 runner 六小時。
    timeout-minutes: 15
    strategy:
      fail-fast: false          # 一個時區壞掉，另一個也要跑完才知道是不是時區問題
      matrix:
        tz: [UTC, Asia/Taipei, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
      CI_HANDLE_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  build:
    # 「建得起來」跟「點得動」是兩回事：build 只打包不執行，
    # 之前就發生過建置全綠、按鈕一按整個爆掉還照樣上線。
    # 所以這個 job 兩件都做：先跑 smoke test，再建置。
    name: 前端建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
